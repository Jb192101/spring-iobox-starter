iobox:
  shedlock:
    provider: zookeeper
  zookeeper:
    connect-string: "zookeeper:2181"

  storage: jpa
  broker: kafka

  outbox:
    enabled: false
    max-retries: 5
    deduplication-enabled: true
    retention-days: 7
    scheduler:
      enabled: true
      interval: 5000
      cleanup-cron: "0 0 3 * * *"
    context-manager:
      enabled: true
      default-topic: "default"

  inbox:
    enabled: false
    max-retries: 5
    deduplication-enabled: true
    retention-days: 7
    scheduler:
      enabled: true
      interval: 5000
      cleanup-cron: "0 0 3 * * *"

    kafka:
      topics: "user-created,order-created,test-success"

  dlq:
    enabled: false
    dlqName: "dead-letters"
    scheduler:
      enabled: true
      interval: 5000

#iobox:
#  broker: kafka

spring:
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  health:
    rabbit:
      enabled: false