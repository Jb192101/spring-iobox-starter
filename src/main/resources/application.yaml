iobox:
  shedlock:
    provider: zookeeper
  zookeeper:
    connect-string: "zookeeper:2181"

  storage: jpa
  broker: kafka

  outbox:
    enabled: true
    max-retries: 5
    deduplication-enabled: true
    retention-days: 7
    scheduler:
      enabled: true
      concurrency-level: 1
      interval: 5000
      cleanup-cron: "0 0 3 * * *"
    context-manager:
      enabled: true
      default-topic: "default"

  inbox:
    enabled: true
    max-retries: 5
    deduplication-enabled: true
    retention-days: 7
    scheduler:
      enabled: true
      concurrency-level: 1
      interval: 5000
      cleanup-cron: "0 0 3 * * *"

    kafka:
      topics: "user-created,order-created,test-success"

  dlq:
    enabled: true
    dlqName: "dead-letters"
    scheduler:
      enabled: true
      interval: 5000

#iobox:
#  broker: kafka

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.jms.JmsHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  health:
    jms:
      enabled: false
    rabbit:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false